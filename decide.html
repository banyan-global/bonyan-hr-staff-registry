<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>قرار طلب الإجازة · مجموعة بنيان العالمية</title>
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#161D35">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2316294a'/%3E%3Crect x='1.5' y='1.5' width='29' height='29' rx='6.5' fill='none' stroke='%23e3c485' stroke-opacity='.45'/%3E%3Ctext x='16' y='21.6' text-anchor='middle' font-family='Arial,Helvetica,sans-serif' font-weight='900' font-size='14' letter-spacing='-.3' fill='%23e3c485'%3EHR%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap">
<style>
:root{--nd:#161D35;--nv:#1B2347;--nc:#2D3A6B;--gd:#C9A84C;--gl:#DDB95A;--gp:#FBF5E6;--bg:#EDEEF4;--bd:#DDE1EE;--t2:#4A5572;--mu:#8E97B4;--gr:#1A6B3C;--rd:#C0392B;--card:#fff;--ink:#1B2347}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:Tajawal,'IBM Plex Sans Arabic',Tahoma,Arial,sans-serif;font-size:15px;line-height:1.75;-webkit-font-smoothing:antialiased;min-height:100vh}
.wrap{max-width:680px;margin:0 auto;padding:22px 16px 30px}
.card{background:var(--card);border-radius:20px;overflow:hidden;box-shadow:0 18px 46px rgba(22,29,53,.14),0 2px 6px rgba(22,29,53,.06)}
.hd{background:linear-gradient(135deg,var(--nd),var(--nv) 60%,#24305c);color:#fff;text-align:center;padding:24px 22px 20px;position:relative}
.hd:after{content:"";position:absolute;inset:auto 0 0 0;height:3px;background:linear-gradient(90deg,transparent,var(--gd),transparent)}
.hd img{height:54px;display:block;margin:0 auto 10px}
.hd .ent{color:var(--gd);font-size:12.5px;font-weight:800;letter-spacing:.5px}
.hd h1{margin:4px 0 0;font-size:21px;font-weight:900}
.hd .no[hidden]{display:none}
.hd .no{display:inline-block;margin-top:8px;direction:ltr;font-family:'IBM Plex Mono',Consolas,monospace;font-size:12.5px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);padding:2px 10px;border-radius:99px;color:#E7EAF5}
.bd{padding:22px 22px 8px}
.hi{display:flex;gap:12px;align-items:flex-start;background:#F6F7FB;border:1px solid var(--bd);border-radius:14px;padding:12px 14px;margin-bottom:16px}
.hi .ico{flex:none;width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:var(--nv);color:var(--gl)}
.hi b{display:block;font-size:15px}
.hi span{font-size:13.5px;color:var(--t2)}
.hi.done{background:#F1F8F4;border-color:#CFE5D8}.hi.done .ico{background:var(--gr);color:#fff}
.hi.bad{background:#FCF1EF;border-color:#F0D2CD}.hi.bad .ico{background:var(--rd);color:#fff}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.trail{display:flex;align-items:flex-start;gap:0;margin:4px 0 18px;padding:0;list-style:none}
.trail li{flex:1;text-align:center;position:relative;font-size:12px;color:var(--mu);font-weight:700}
.trail li:before{content:"";position:absolute;top:13px;left:50%;width:100%;height:2px;background:var(--bd);z-index:0}
.trail li:first-child:before{display:none}
.trail li i{position:relative;z-index:1;display:grid;place-items:center;width:28px;height:28px;margin:0 auto 4px;border-radius:50%;background:#fff;border:2px solid var(--bd);font-style:normal;font-size:12px;color:var(--mu)}
.trail li.ok i{background:var(--gr);border-color:var(--gr);color:#fff}.trail li.ok{color:var(--gr)}.trail li.ok:before{background:var(--gr)}
.trail li.now i{border-color:var(--gd);color:var(--nv);background:var(--gp);box-shadow:0 0 0 4px rgba(201,168,76,.18)}.trail li.now{color:var(--nv)}
.trail li.x i{background:var(--rd);border-color:var(--rd);color:#fff}.trail li.x{color:var(--rd)}
.trail li small{display:block;font-weight:500;font-size:11px;color:var(--mu)}
h2.sec{font-size:14px;margin:18px 0 8px;color:var(--nv);display:flex;align-items:center;gap:8px}
h2.sec:before{content:"";width:4px;height:16px;border-radius:2px;background:var(--gd)}
table.dt{width:100%;border-collapse:collapse;font-size:14px;border-radius:12px;overflow:hidden;border:1px solid var(--bd)}
table.dt td{padding:9px 12px;border-bottom:1px solid var(--bd);vertical-align:top}
table.dt tr:nth-child(even){background:var(--bg)}
table.dt tr:last-child td{border-bottom:0}
table.dt td:first-child{color:var(--mu);font-weight:800;width:36%;white-space:nowrap}
table.dt td:last-child{font-weight:700;color:var(--nv);word-break:break-word}
.sub{background:var(--gp);border:1px solid var(--gd);border-radius:14px;padding:12px 14px;margin:14px 0}
.sub .t{color:#9C7E2E;font-weight:800;font-size:13px;margin-bottom:6px}
.sub table.dt{border-color:#EADDB5}
.box{border-right:4px solid var(--nv);background:var(--bg);border-radius:10px;padding:10px 14px;margin:12px 0;font-size:14px}
.box b{display:block;color:var(--nv);font-size:13px}
.box.g{border-color:var(--gd);background:var(--gp)}.box.g b{color:#9C7E2E}
.box.r{border-color:var(--rd);background:#FCF1EF}.box.r b{color:var(--rd)}
table.ch{width:100%;border-collapse:collapse;font-size:13px;border:1px solid var(--bd);border-radius:12px;overflow:hidden;margin:6px 0 4px}
table.ch th{background:var(--nv);color:#fff;padding:8px 10px;text-align:right;font-weight:800}
table.ch td{padding:8px 10px;border-bottom:1px solid var(--bd)}
table.ch td.o{color:var(--rd);text-decoration:line-through}table.ch td.n{color:var(--gr);font-weight:800}
.dec{margin:20px 0 6px;padding:16px;border:1px solid var(--bd);border-radius:16px;background:#FAFBFD}
.dec label{display:block;font-weight:800;font-size:13.5px;margin-bottom:6px;color:var(--nv)}
textarea,input,select{width:100%;font:inherit;font-size:14.5px;color:var(--ink);background:#fff;border:1.5px solid var(--bd);border-radius:11px;padding:9px 12px;outline:none;transition:border-color .15s,box-shadow .15s}
textarea{min-height:76px;resize:vertical}
textarea:focus,input:focus,select:focus{border-color:var(--nc);box-shadow:0 0 0 3px rgba(45,58,107,.13)}
.fs-btn{min-height:44px;background:#fff;border:1.5px solid var(--bd);border-radius:11px;color:var(--ink);font-size:14.5px}
.fs-btn:focus-visible,.fs-btn.fs-open{border-color:var(--nc);box-shadow:0 0 0 3px rgba(45,58,107,.13)}
textarea.need{border-color:var(--rd);box-shadow:0 0 0 3px rgba(192,57,43,.13);background:#FFFBFA}
.hint{font-size:12.5px;color:var(--mu);margin-top:4px}
.err{color:var(--rd);font-size:13.5px;font-weight:700;min-height:1.4em;margin:8px 0 0}
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.acts.two{grid-template-columns:1fr 1fr}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:inherit;font-weight:800;font-size:14.5px;border:0;border-radius:12px;padding:12px 14px;cursor:pointer;text-decoration:none;transition:transform .12s,filter .15s,box-shadow .15s}
.btn:hover{filter:brightness(1.06)}.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.55;cursor:wait}
.btn:focus-visible{outline:3px solid var(--gl);outline-offset:2px}
.b-ok{background:var(--gr);color:#fff;box-shadow:0 6px 16px rgba(26,107,60,.25)}
.b-ed{background:var(--gd);color:var(--nd);box-shadow:0 6px 16px rgba(201,168,76,.28)}
.b-no{background:var(--rd);color:#fff;box-shadow:0 6px 16px rgba(192,57,43,.22)}
.b-ghost{background:#fff;color:var(--nv);border:1.5px solid var(--bd)}
.b-nv{background:var(--nv);color:#fff}
.pick{outline:3px solid var(--gl);outline-offset:3px;animation:pulse 1.6s ease-in-out 2}
@keyframes pulse{50%{outline-offset:6px}}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid .w{grid-column:1/-1}
.fl label{font-size:13px}
.days{display:flex;align-items:center;gap:8px;background:var(--gp);border:1px dashed var(--gd);border-radius:11px;padding:8px 12px;font-size:13.5px;color:#7A6224;font-weight:700}
.res{text-align:center;padding:26px 10px 10px}
.res .big{width:68px;height:68px;border-radius:50%;display:grid;place-items:center;margin:0 auto 12px;color:#fff;background:var(--gr);box-shadow:0 10px 26px rgba(26,107,60,.3)}
.res .big.r{background:var(--rd);box-shadow:0 10px 26px rgba(192,57,43,.3)}
.res .big svg{width:34px;height:34px;stroke-width:2.4}
.res h3{margin:0 0 4px;font-size:19px}
.res p{margin:0 auto;max-width:440px;color:var(--t2)}
.load{padding:60px 10px;text-align:center;color:var(--t2)}
.load i{display:block;width:36px;height:36px;margin:0 auto 12px;border-radius:50%;border:3px solid var(--bd);border-top-color:var(--gd);animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.ft{text-align:center;color:var(--mu);font-size:12px;padding:14px 10px 4px}
.ft a{color:var(--nv);font-weight:800;text-decoration:none}
.ft2{background:var(--nv);color:var(--gl);text-align:center;font-size:12px;padding:12px;margin-top:16px}
.oj-sign{--oj-accent:#f97415;display:flex;flex-direction:column;align-items:center;gap:8px;direction:rtl;font-family:inherit;text-align:center;padding:14px 0;color:var(--t2)}
.oj2{display:inline-flex;flex-direction:column;align-items:center;white-space:nowrap;font-size:12.5px;line-height:1.2;color:inherit;background:color-mix(in srgb,var(--oj-accent) 9%,transparent);border:1px solid color-mix(in srgb,var(--oj-accent) 30%,transparent);border-radius:22px;padding:7px 14px;text-decoration:none;transition:background .3s,box-shadow .3s}
.oj2-row{display:inline-flex;align-items:center;gap:8px}
.oj2 b{color:var(--oj-accent);font-weight:700}
.oj2-dot{flex:none;width:7px;height:7px;border-radius:50%;background:var(--oj-accent)}
.oj2-mail{display:inline-block;max-width:0;overflow:hidden;opacity:0;white-space:nowrap;direction:ltr;unicode-bidi:isolate;font-size:11.5px;border-right:1px solid color-mix(in srgb,var(--oj-accent) 35%,transparent);transition:max-width .45s,opacity .3s,padding .45s}
.oj2:hover .oj2-mail,.oj2:focus-visible .oj2-mail{max-width:22em;opacity:.85;padding-right:9px}
.oj2-role{display:block;max-height:0;overflow:hidden;opacity:0;font-size:11px;transition:max-height .4s,opacity .35s,margin .4s,padding .4s}
.oj2:hover .oj2-role,.oj2:focus-visible .oj2-role{max-height:2em;opacity:.8;margin-top:5px;padding-top:5px;border-top:1px solid color-mix(in srgb,var(--oj-accent) 25%,transparent)}
.oj2-copy{font-size:11.5px;opacity:.65}
@media (max-width:560px){
  .wrap{padding:0 0 20px}
  .card{border-radius:0;box-shadow:none}
  .bd{padding:18px 14px 6px}
  .acts{grid-template-columns:1fr}
  .grid{grid-template-columns:1fr}
  table.dt td:first-child{white-space:normal;width:40%}
  .trail li{font-size:11px}
}
@media print{.dec,.ft,.oj-sign{display:none}body{background:#fff}.card{box-shadow:none}}
</style>
</head>
<body>
<main class="wrap">
  <div class="card">
    <header class="hd">
      <img id="lg" alt="بنيان" src="data:,">
      <div class="ent" id="ent">مجموعة بنيان العالمية</div>
      <h1 id="ttl">طلب إجازة</h1>
      <span class="no" id="no" hidden></span>
    </header>
    <div class="bd" id="app"><div class="load"><i></i>جارٍ فتح الطلب…</div></div>
    <div class="ft2">مجموعة بنيان العالمية - نظام إدارة طلبات الإجازات</div>
  </div>
  <p class="ft">يمكنك أيضًا متابعة الطلبات من <a href="./">منصة بنيان للموارد البشرية</a> بعد تسجيل الدخول.</p>
  <div class="oj-sign" data-accent="#C9A84C">

      <span class="oj2-row"><span class="oj2-dot"></span><span class="oj2-txt">تطوير وتنفيذ <b>أسامة جنيدي</b></span><span class="oj2-mail">osama.mo.bonyan@gmail.com</span></span>
      <span class="oj2-role">أخصائي بيانات ومطوّر أنظمة</span>
    </a>
    <div class="oj2-copy">© <span class="oj2-year">2026</span> مجموعة بنيان العالمية</div>
  </div>
</main>

</html>
