name: فحص الكود
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.2' }
      - name: فحص صياغة PHP
        run: for f in api/*.php server/*.php server/cli/*.php; do php -l "$f"; done
      - name: فحص صياغة JavaScript
        run: for f in *.js; do node --check "$f"; done
      - name: لا أسرار في المستودع
        run: |
          ! git ls-files | grep -E '(^|/)config\.php$'
          ! grep -RInE "'pass' => '[^']+'" --include=*.php . 
